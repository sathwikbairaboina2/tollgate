# Demo stack: gateway + deterministic fake upstream + Prometheus + Jaeger.
# Host ports (overridable): 5450 gateway, 5451 Prometheus, 5452 Jaeger UI (ADR 0009). The gateway still listens on :8787 inside its container. No AWS, so no LocalStack.
name: tollgate

services:
  fake-upstream:
    build: .
    image: tollgate:dev
    entrypoint: ["/fakeupstream", "-addr", ":9000"]

  tollgate:
    build: .
    image: tollgate:dev
    depends_on: [fake-upstream, jaeger]
    ports: ["${TOLLGATE_PORT:-5450}:8787"]
    environment:
      TOLLGATE_DEMO_KEY: ${TOLLGATE_DEMO_KEY:-local-demo}
      TOLLGATE_TINY_KEY: ${TOLLGATE_TINY_KEY:-local-tiny}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./deploy/compose.tollgate.yaml:/etc/tollgate/tollgate.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${TOLLGATE_PROM_PORT:-5451}:9090"]
    depends_on: [tollgate]

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["${TOLLGATE_JAEGER_PORT:-5452}:16686"]

  bench:
    profiles: ["bench"]
    image: golang:1.25
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    command: ["go", "run", "./bench", "-workload", "bench/workload.jsonl", "-out", "bench/results/latest.json"]

volumes:
  gomod:
    name: tollgate-gomod
  gobuild:
    name: tollgate-gobuild
